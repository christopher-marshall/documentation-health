[project]
name = "dochealth"
version = "0.2.0"
description = "Per-page documentation health metrics for docs-as-code repos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "textstat",
]

[project.optional-dependencies]
dashboard = ["streamlit", "numpy"]

[project.scripts]
dochealth = "dochealth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dochealth"]
